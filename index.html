<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ceniza y Luz</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="Una noche la Bruma ataca tu aldea y se lleva a uno de los gemelos. Elige a Alba o a Ciro, toma la Hoja de Luz y recorre cinco zonas con enemigos, cofres, puzzles y un mercader hasta el jefe final."
    />
    <meta property="og:title" content="Ceniza y Luz" />
    <meta property="og:description" content="Cruza la Bruma, encuentra la luz y recupera a tu hermano." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://dannnyusssssss.github.io/Ceniza-y-Luz/cover.png" />
  </head>
  <body>
    <a class="skip-link" href="#game">Saltar al juego</a>
    <main>
      <h1 class="visually-hidden">Ceniza y Luz</h1>
      <canvas id="game" tabindex="0" aria-label="Escena del juego"></canvas>
      <div id="fade" class="fade" aria-hidden="true"></div>
      <div id="hud" class="hud" hidden></div>
      <div id="menu" class="screen" hidden></div>
    </main>
    <pre id="debug" class="debug" aria-hidden="true" hidden></pre>
    <div id="loading" class="loading" role="status">
      <p id="loading-text"></p>
      <div class="loading-bar" aria-hidden="true"><div id="loading-fill"></div></div>
    </div>
    <div id="fatal" role="alert" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
